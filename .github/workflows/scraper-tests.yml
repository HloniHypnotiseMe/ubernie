name: C6 scraper tests

on:
  pull_request:
    paths:
      - "web-department/scraper/**"
      - "web-department/requirements.txt"
      - ".github/workflows/scraper-tests.yml"
  push:
    branches: [main]
    paths:
      - "web-department/scraper/**"
      - "web-department/requirements.txt"
      - ".github/workflows/scraper-tests.yml"

jobs:
  scraper-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-department
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: web-department/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run scraper tests
        run: python -m pytest -q scraper/tests
