name: Ubernie Web Department

on:
  push:
    branches: [main, "fix/**", "feature/**"]
  pull_request:
    paths:
      - "web-department/**"
      - ".github/workflows/web-department.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-department
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Contract tests
        run: pytest -q
