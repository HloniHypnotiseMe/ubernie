schema_version: "1.0"
product: ubernie
legal_owner: "RemotePay Fintech Services"
public_identity: "UBERNIE"
branch: "feature/ubernie-intelligence-acquisition"
status_semantics:
  registered: "Listed in a capability registry; not proof of install or operation."
  inspected: "Source code and licence inspected."
  selected: "Approved for a defined UBERNIE requirement."
  extracted: "Required component copied/adapted into UBERNIE with provenance."
  works: "Execution demonstrated by tests."
  verified: "Evidence recorded for the acceptance criteria."
  live: "Production runtime and external routing directly verified."
extractions: []
